<div class="app-shell">
	<aside class="app-sidebar" aria-label="Main navigation">
		<a class="app-brand" routerLink="/admin/dashboard" aria-label="Neo Care dashboard">
			<span class="brand-mark">H+</span>
			<span class="brand-name">Neo Care</span>
		</a>

		<nav class="sidebar-nav">
			@for (section of ['Overview', 'Management', 'Assets']; track section) {
				@if (itemsForSection(section).length) {
					<p class="nav-label">{{ section }}</p>
					@for (item of itemsForSection(section); track item.route) {
						<a class="nav-link" [routerLink]="item.route" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
							<span class="nav-icon" aria-hidden="true">&#9632;</span>
							<span>{{ item.title }}</span>
						</a>
					}
				}
			}
		</nav>

		<div class="sidebar-footer">
			<div class="care-status"><span class="status-dot"></span> System operational</div>
			<button class="logout-button" type="button" routerLink="/login">Sign out</button>
		</div>
	</aside>

	<main class="app-main">
		<header class="app-topbar">
			<div class="breadcrumb"><span class="breadcrumb-mark">+</span><span>Hospital operations</span></div>
			<div class="topbar-actions">
				<span class="topbar-date">19 Aug 2026</span>
				<span class="user-avatar" aria-label="Current user">DA</span>
			</div>
		</header>
		<section class="page-content">
			<router-outlet></router-outlet>
		</section>
	</main>
</div>
